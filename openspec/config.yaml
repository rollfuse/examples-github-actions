schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Tech stack: Go (standard library only, plus github.com/rollfuse/go-sdk),
  GitHub Actions workflow YAML. No Docker, no long-running service.

  Domain: a runnable example repository under the rollfuse GitHub
  organization — not the rollfuse platform itself. It demonstrates gating
  a CI/CD pipeline step on a rollfuse flag (a deploy kill switch), using a
  small CLI (cmd/flag-gate) built on github.com/rollfuse/go-sdk, plus a
  self-contained mock of the rollfuse platform API (cmd/mock-rollfuse-api)
  so the demo workflow (.github/workflows/deploy-with-flag-gate.yml) runs
  with no rollfuse account.

  This repo has no behavioral contract of its own worth a formal
  openspec/specs/ capability — it's a demo, kept intentionally small.
  OpenSpec here is for planning nontrivial changes to the demo itself,
  not for specifying product behavior.
